name: Generate Pacman Game

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. Depoyu kontrol et
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Pacman animasyonunu oluştur
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@prod
        with:
          github_user_name: karadumanyusuf
          # Dosyayı doğrudan ana dizine koyuyoruz ki karmaşa çıkmasın
          svg_out_path: pacman-contribution-graph.svg

      # 3. Oluşan dosyayı 'output' branch'ine yükle
      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

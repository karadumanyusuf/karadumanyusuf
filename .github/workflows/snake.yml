name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake with labels
        uses: Platane/snk@v3
        with:
          github_user_name: karadumanyusuf
          svg_out_path: dist/snake.svg
          snake_color: "#00FFFF"
          bg_color: "#000000"
          color_dots: |
            #0d1117,#161b22,#0e4429,#006d32,#26a641,#39d353
          show_months: true
          show_total: true

      - name: Push
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
